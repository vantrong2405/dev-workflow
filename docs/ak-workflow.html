<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sơ đồ luồng ak</title>
  <style>
    :root {
      --ink: #211914;
      --muted: #655246;
      --accent: #b44213;
      --white: #fff;
      --night-text: #fffaf5;
      --sans: "Be Vietnam Pro", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    body { margin: 0; background: var(--white); }
    main { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 330px; max-width: 31rem; height: auto; margin-inline: auto; }
    svg text { fill: var(--ink); text-anchor: middle; }
    .diagram-node { font: 750 20px var(--sans); }
    .diagram-side { font-size: 17px; }
    .diagram-small { fill: var(--muted); font: 500 14px var(--sans); }
    .diagram-label text { fill: var(--muted); font: 700 12px var(--mono); font-variant-ligatures: none; }
    .diagram-on-dark { fill: var(--night-text); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    a:hover rect, a:focus-visible rect { stroke: var(--accent); stroke-width: 2.5; }
  </style>
</head>
<body>
  <main>
    <svg class="workflow-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 548" role="img" aria-labelledby="ak-flow-title ak-flow-desc">
      <title id="ak-flow-title">Luồng một task với ak</title>
      <desc id="ak-flow-desc">Mở task với ak. Repo mới học dự án rồi quay lại luồng chính. Agent hiểu việc và tái hiện bug UI trước khi sửa. Sau đó chạy test và so với ảnh mẫu nếu giao diện thay đổi. Nếu chưa đạt, xử lý rồi kiểm chứng lại. Khi đạt, bàn giao để review. Tùy chọn ship tiếp tục sang chuẩn bị phát hành.</desc>
      <defs>
        <marker id="ak-flow-arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="#655246"/>
        </marker>
        <marker id="ak-flow-arrow-accent" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="#b44213"/>
        </marker>
      </defs>
      <rect width="432" height="548" fill="#fff"/>

      <g fill="none" stroke="#655246" stroke-width="1.6" marker-end="url(#ak-flow-arrow)">
        <path d="M116 96 V136"/>
        <path d="M116 192 V216"/>
        <path d="M116 264 V288"/>
        <path d="M116 344 V368"/>
        <path d="M192 396 H280"/>
        <path d="M344 368 V324 A8 8 0 0 0 336 316 H208"/>
        <path d="M208 64 H280" stroke-dasharray="5 4"/>
        <path d="M208 488 H280" stroke-dasharray="5 4"/>
      </g>
      <path d="M344 96 V104 A8 8 0 0 1 336 112 H116" fill="none" stroke="#655246" stroke-width="1.6" stroke-dasharray="5 4"/>
      <circle cx="116" cy="112" r="3" fill="#655246"/>
      <path d="M116 424 V460" fill="none" stroke="#b44213" stroke-width="2" marker-end="url(#ak-flow-arrow-accent)"/>

      <g class="diagram-label" text-anchor="middle">
        <rect x="212" y="40" width="64" height="16" fill="#fff"/>
        <text x="244" y="52">REPO MỚI</text>
        <rect x="200" y="372" width="72" height="16" fill="#fff"/>
        <text x="236" y="384">CHƯA ĐẠT</text>
        <rect x="126" y="432" width="36" height="16" fill="#fff"/>
        <text x="144" y="444">ĐẠT</text>
        <rect x="212" y="464" width="64" height="16" fill="#fff"/>
        <text x="244" y="476">--ship</text>
      </g>

      <a href="catalog.html#skill-start" target="_top" aria-label="Xem skill start">
        <rect x="24" y="32" width="184" height="64" rx="28" fill="#b44213" stroke="#b44213"/>
        <text x="116" y="58" class="diagram-node diagram-on-dark">/ak</text>
        <text x="116" y="79" class="diagram-small diagram-on-dark">Giao việc</text>
      </a>
      <a href="catalog.html#skill-learning" target="_top" aria-label="Xem skill learning">
        <rect x="280" y="32" width="128" height="64" rx="6" fill="#fffaf5" stroke="#987c6d"/>
        <text x="344" y="58" class="diagram-node diagram-side">Học dự án</text>
        <text x="344" y="79" class="diagram-small">:learning</text>
      </a>
      <a href="catalog.html#skills-understand" target="_top" aria-label="Xem các skill hiểu việc">
        <rect x="24" y="136" width="184" height="56" rx="6" fill="#fffaf5" stroke="#987c6d"/>
        <text x="116" y="159" class="diagram-node">Hiểu việc</text>
        <text x="116" y="179" class="diagram-small">Tiêu chí · tái hiện lỗi UI</text>
      </a>
      <a href="catalog.html#skill-build" target="_top" aria-label="Xem skill build">
        <rect x="24" y="216" width="184" height="48" rx="6" fill="#fffaf5" stroke="#987c6d"/>
        <text x="116" y="246" class="diagram-node">Sửa code</text>
      </a>
      <a href="catalog.html#skills-verify" target="_top" aria-label="Xem các skill kiểm chứng">
        <rect x="24" y="288" width="184" height="56" rx="6" fill="#fffaf5" stroke="#987c6d"/>
        <text x="116" y="311" class="diagram-node">Kiểm chứng</text>
        <text x="116" y="331" class="diagram-small">Review · test · check</text>
      </a>
      <polygon points="116,368 192,396 116,424 40,396" fill="#fff" stroke="#655246" stroke-width="1.4"/>
      <text x="116" y="402" class="diagram-node diagram-side">Đạt?</text>
      <a href="catalog.html#skills-verify" target="_top" aria-label="Xem cách xử lý khi kiểm chứng chưa đạt">
        <rect x="280" y="368" width="128" height="56" rx="6" fill="#fffaf5" stroke="#987c6d"/>
        <text x="344" y="391" class="diagram-node diagram-side">Xử lý lỗi</text>
        <text x="344" y="412" class="diagram-small">Rồi kiểm lại</text>
      </a>
      <a href="catalog.html#skills-release" target="_top" aria-label="Xem các skill bàn giao">
        <rect x="24" y="460" width="184" height="56" rx="28" fill="#fff0e3" stroke="#b44213" stroke-width="1.5"/>
        <text x="116" y="483" class="diagram-node">Bàn giao</text>
        <text x="116" y="503" class="diagram-small">Sẵn sàng review</text>
      </a>
      <a href="catalog.html#skill-ship" target="_top" aria-label="Xem skill ship">
        <rect x="280" y="460" width="128" height="56" rx="6" fill="#fffaf5" stroke="#987c6d"/>

        <text x="344" y="503" class="diagram-small">:ship · :audit</text>
      </a>
    </svg>
  </main>
</body>
</html>
